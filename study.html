const LEVEL_LABEL={beginner:"🌱 初級",intermediate:"🌿 中級",advanced:"🌳 上級",extreme:"🔥 超難問"};
const COURSE_LABEL={kanji:"🈶 漢字コース",reading:"📖 文章題コース",general:"🌟 日本語力コース"};

let pool=[],idx=0,scoreNow=0,total=20,curCourse="kanji",curLevel="beginner",answered=false;
let memStats={answered:0,correct:0};
const $=id=>document.getElementById(id);
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

/* 語彙データから「読み」「意味」の2択問題セットを自動生成 */
function buildWordQuestions(levelKey){
  const words=WORDS[levelKey];
  const qs=[];
  words.forEach(entry=>{
    const others=words.filter(w=>w!==entry);
    const wrongR=shuffle([...others]).slice(0,3).map(w=>w.r);
    qs.push({t:`「${entry.w}」の読み方は？`,o:[entry.r,...wrongR],a:0,k:"🈶 漢字・読み"});
    const wrongM=shuffle([...others]).slice(0,3).map(w=>w.m);
    qs.push({t:`「${entry.w}」の意味として最も適切なものは？`,o:[entry.m,...wrongM],a:0,k:"📝 語句・意味"});
  });
  return qs;
}
function buildPassageQuestions(levelKey){
  return PASSAGES[levelKey].map(p=>({t:p.t,o:[...p.o],a:p.a,k:"📖 読解"}));
}
function buildPool(course,level){
  if(course==="kanji") return buildWordQuestions(level);
  if(course==="reading") return buildPassageQuestions(level);
  return [...buildWordQuestions(level),...buildPassageQuestions(level)];
}

function chooseCourse(course){
  curCourse=course;
  $("home").classList.add("hidden");
  $("levels").classList.remove("hidden");
  $("levelTitle").textContent="📶 "+COURSE_LABEL[course]+" のレベルを選ぼう";
}
function start(level){
  curLevel=level;
  let src=buildPool(curCourse,curLevel);
  total=Math.min(20,src.length);
  pool=shuffle(src.map(q=>({...q,o:[...q.o]}))).slice(0,total);
  idx=0;scoreNow=0;
  $("home").classList.add("hidden");$("levels").classList.add("hidden");
  $("stats").classList.add("hidden");$("result").classList.add("hidden");
  $("quiz").classList.remove("hidden");$("score").textContent="0問正解";
  $("levelBadge").textContent=LEVEL_LABEL[curLevel];
  showQuestion();
}
function showQuestion(){
  answered=false;$("feedback").className="feedback hidden";$("next").classList.add("hidden");
  let q=pool[idx],opts=q.o.map((text,i)=>({text,originalIndex:i}));shuffle(opts);
  $("type").textContent=q.k;$("count").textContent=(idx+1)+" / "+total;
  $("bar").style.width=(idx/total*100)+"%";$("question").textContent=q.t;$("answers").innerHTML="";
  opts.forEach((o,i)=>{let b=document.createElement("button");b.className="choice";b.textContent=String.fromCharCode(65+i)+". "+o.text;b.onclick=()=>answer(b,o.originalIndex===q.a,opts);$("answers").appendChild(b)});
}
function answer(btn,ok,opts){
  if(answered)return;answered=true;
  document.querySelectorAll(".choice").forEach(b=>b.disabled=true);
  if(ok){btn.classList.add("correct");scoreNow++;$("feedback").className="feedback ok";$("feedback").textContent="⭕ 正解！ええ感じじゃ！"}
  else{btn.classList.add("wrong");let p=opts.findIndex(o=>o.originalIndex===pool[idx].a);document.querySelectorAll(".choice")[p].classList.add("correct");$("feedback").className="feedback ng";$("feedback").textContent="❌ 惜しい！緑色が正解じゃ。"}
  $("feedback").classList.remove("hidden");$("score").textContent=scoreNow+"問正解";$("next").classList.remove("hidden");
}
function nextQuestion(){if(idx>=total-1)finish();else{idx++;showQuestion()}}
function finish(){
  $("quiz").classList.add("hidden");$("result").classList.remove("hidden");
  let pct=Math.round(scoreNow/total*100);
  $("finalScore").textContent=scoreNow;$("finalTotal").textContent=total;$("percent").textContent=pct+"%";
  $("comment").textContent=pct>=90?"🔥 かなり強い！この調子じゃ！":pct>=70?"👍 ええ感じ！間違えたところを復習したらさらに伸びるで！":"💪 ここからじゃ！知らん言葉を一個ずつ覚えていこう！";
  memStats.answered+=total;memStats.correct+=scoreNow;
}
function restart(){start(curLevel)}
function backHome(){$("quiz").classList.add("hidden");$("result").classList.add("hidden");$("stats").classList.add("hidden");$("levels").classList.add("hidden");$("home").classList.remove("hidden")}
function showStats(){$("home").classList.add("hidden");$("stats").classList.remove("hidden");let a=memStats.answered,s=memStats.correct;$("allAnswered").textContent=a;$("allCorrect").textContent=s;$("allPercent").textContent=a?Math.round(s/a*100)+"%":"0%"}
function resetStats(){memStats={answered:0,correct:0};showStats()}
</script></body></html>
